# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how hugo-editor is built and checked. CI uses these
# tasks. Renovate keeps every pin in this file current.

# mise would otherwise read tool versions from files like .nvmrc or
# .bun-version; every tool comes from this file only.
[settings]
idiomatic_version_file_enable_tools = []

[tools]
bun = "1.4.2"
# Next.js builds and serves on Node, the same major Vercel runs the app on.
# @types/node follows this major.
node = "24.21.0"
# Links the project, pulls its environment and deploys by hand (see README).
"npm:vercel" = "62.2.0"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters for the repository's YAML and workflows
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

[tasks.install]
description = "Install the dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run the Next.js dev server on localhost:3000"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Build the Next.js app for production"
depends = ["install"]
run = "bun run build"

# bunfig.toml has every bun test run write coverage/lcov.info, which CI
# uploads to Codecov.
[tasks.test]
description = "Run the data-file tests with coverage"
depends = ["install"]
run = "bun test"

[tasks.typecheck]
description = "Type-check the app and the tests with tsc"
depends = ["install"]
run = "bun run typecheck"

# `mise run fmt` rewrites what Biome can fix; `mise run lint` checks the same
# things without touching a file.
[tasks.fmt]
description = "Format the sources and apply Biome's safe fixes"
depends = ["install"]
run = "bun run format"

[tasks.lint]
description = "Lint the sources with Biome, and the YAML and workflows"
depends = ["ts-lint", "yaml-lint", "actionlint"]

[tasks.ts-lint]
description = "Lint the sources and check their formatting with Biome"
depends = ["install"]
run = "bun run lint"

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

# The build runs after the others: next build rewrites .next/types, which
# tsconfig.json includes, so a type check running alongside it can read a
# half-written directory.
[tasks.check]
description = "The definition of done: every gate CI runs"
depends = ["lint", "typecheck", "test"]
run = [{ task = "build" }]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run"
